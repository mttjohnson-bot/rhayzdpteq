name: Update Visual Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on'
        required: true
        type: string
      force:
        description: 'Force commit even if snapshots appear unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-snapshots:
    name: Regenerate Baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Convert character models (.vox → .glb)
        run: node scripts/convert-models.mjs

      - name: Verify .glb assets exist
        run: node scripts/verify-assets.mjs

      - name: Build production bundle
        run: npm run build

      - name: Delete existing snapshots (force rebuild)
        if: inputs.force
        run: rm -rf tests/e2e/__snapshots__/

      - name: Update visual snapshots
        run: npm run test:e2e:update-snapshots

      - name: Check for changes
        id: changes
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git diff --quiet tests/e2e/__snapshots__/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated baselines
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__snapshots__/
          git commit -m "chore: update visual regression baselines [skip ci]"
          git push origin ${{ inputs.branch }}

      - name: Upload updated snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updated-snapshots
          path: tests/e2e/__snapshots__/
          retention-days: 30
