name: Convert Character Models

# Converts .vox source files to optimized .glb for the game.
# Uses a Node.js script with @gltf-transform/core — no external tools needed.
# The script has built-in MD5-based caching (skips unchanged models).
# Commits the results back to the branch.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to convert models on
        required: true
        default: main

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache converted .glb files keyed on hash of all .vox source files
      - name: Restore cached .glb files
        id: cache-glb
        uses: actions/cache@v5
        with:
          path: |
            public/assets/characters/*.glb
            public/assets/characters/*.md5
          key: glb-models-${{ hashFiles('assets/characters/*.vox', 'scripts/convert-models.mjs') }}

      - name: Convert models
        if: steps.cache-glb.outputs.cache-hit != 'true'
        run: node scripts/convert-models.mjs

      - name: Commit converted models
        if: steps.cache-glb.outputs.cache-hit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/*.glb
          if git diff --cached --quiet; then
            echo "No new .glb files to commit"
          else
            git commit -m "chore: auto-convert .vox models to optimized .glb"
            git push origin ${{ inputs.branch }}
          fi
