name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # ── Convert .vox models to optimized .glb ──
      - name: Compute .vox hash
        id: vox-hash
        run: |
          if ls assets/characters/*.vox 1>/dev/null 2>&1; then
            hash=$(find assets/characters -name '*.vox' -exec md5sum {} \; | sort | md5sum | cut -d' ' -f1)
          else
            hash="no-vox-files"
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore cached .glb files
        id: cache-glb
        uses: actions/cache@v4
        with:
          path: public/assets/characters/*.glb
          key: glb-models-${{ steps.vox-hash.outputs.hash }}

      - name: Install v-optimizer
        if: steps.cache-glb.outputs.cache-hit != 'true'
        run: |
          curl -L -o v-optimizer https://github.com/nicholasgasior/v-optimizer/releases/latest/download/v-optimizer-linux-amd64
          chmod +x v-optimizer
          sudo mv v-optimizer /usr/local/bin/

      - name: Install gltfpack
        if: steps.cache-glb.outputs.cache-hit != 'true'
        run: |
          curl -L -o gltfpack.tar.gz https://github.com/nicholasgasior/gltfpack/releases/latest/download/gltfpack-linux-amd64.tar.gz
          tar xzf gltfpack.tar.gz
          chmod +x gltfpack
          sudo mv gltfpack /usr/local/bin/

      - name: Convert models
        if: steps.cache-glb.outputs.cache-hit != 'true'
        run: ./scripts/convert-models.sh

      - name: Verify .glb assets exist
        run: node scripts/verify-assets.mjs

      - run: npm ci
      - run: npm run build

      - name: Verify .glb files in build output
        run: |
          echo "Checking dist/assets/characters/ for .glb files..."
          ls -la dist/assets/characters/*.glb
          echo "All expected .glb assets present in build output."

      - name: Verify all code-referenced assets exist in build
        run: node scripts/verify-build-assets.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Post-Deploy Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to propagate
        run: sleep 10

      - name: Verify key asset URLs return 200
        run: |
          SITE_URL="${{ needs.deploy.outputs.url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
          echo "Site URL: $SITE_URL"

          FAILED=0
          for path in \
            "" \
            "assets/characters/owl.glb" \
            "favicon.svg" \
            "favicon.ico"; do
            URL="${SITE_URL}${path}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  ✓ $URL ($STATUS)"
            else
              echo "  ✗ $URL ($STATUS)"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "::error::$FAILED asset(s) returned non-200 status after deploy!"
            exit 1
          fi
          echo ""
          echo "All assets verified successfully."
