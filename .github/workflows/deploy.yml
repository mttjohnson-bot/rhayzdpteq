name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── Convert .vox models to optimized .glb ──
      # Uses a Node.js script with @gltf-transform/core — no external tools needed.
      # The script has built-in MD5-based caching (skips unchanged models).
      - name: Restore cached .glb files
        id: cache-glb
        uses: actions/cache@v6
        with:
          path: |
            public/assets/characters/*.glb
            public/assets/characters/*.md5
          key: glb-models-${{ hashFiles('assets/characters/*.vox', 'scripts/convert-models.mjs') }}

      - name: Convert .vox models to .glb
        if: steps.cache-glb.outputs.cache-hit != 'true'
        run: node scripts/convert-models.mjs

      - name: Verify .glb assets exist
        run: node scripts/verify-assets.mjs

      - run: npm run build

      - name: Verify .glb files in build output
        run: |
          echo "Checking dist/assets/characters/ for .glb files..."
          ls -la dist/assets/characters/*.glb
          echo "All expected .glb assets present in build output."

      - name: Verify all code-referenced assets exist in build
        run: node scripts/verify-build-assets.mjs

      - name: Create Pages artifact archive
        run: tar --dereference --hard-dereference --directory dist -cf $RUNNER_TEMP/artifact.tar --exclude=.git --exclude=.github .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke-test:
    name: Post-Deploy Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to propagate
        run: sleep 10

      - name: Verify key asset URLs return 200
        run: |
          SITE_URL="${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
          echo "Site URL: $SITE_URL"

          FAILED=0
          for path in \
            "" \
            "assets/characters/owl.glb" \
            "favicon.svg" \
            "favicon.ico"; do
            URL="${SITE_URL}${path}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  ✓ $URL ($STATUS)"
            else
              echo "  ✗ $URL ($STATUS)"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "::error::$FAILED asset(s) returned non-200 status after deploy!"
            exit 1
          fi
          echo ""
          echo "All assets verified successfully."
