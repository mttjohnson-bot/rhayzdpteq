name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check bundle size budget (5 MB gzipped)
        run: |
          # Calculate total gzipped size of all assets
          TOTAL_BYTES=0
          for file in dist/assets/*; do
            if [ -f "$file" ]; then
              GZIP_SIZE=$(gzip -c "$file" | wc -c)
              FILE_NAME=$(basename "$file")
              HUMAN_SIZE=$(echo "scale=2; $GZIP_SIZE / 1024" | bc)
              echo "  $FILE_NAME: ${HUMAN_SIZE} KB gzipped"
              TOTAL_BYTES=$((TOTAL_BYTES + GZIP_SIZE))
            fi
          done

          TOTAL_KB=$(echo "scale=2; $TOTAL_BYTES / 1024" | bc)
          TOTAL_MB=$(echo "scale=2; $TOTAL_BYTES / 1048576" | bc)
          BUDGET_BYTES=5242880  # 5 MB

          echo ""
          echo "Total gzipped bundle size: ${TOTAL_KB} KB (${TOTAL_MB} MB)"
          echo "Budget: 5.00 MB"

          if [ "$TOTAL_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Bundle size ${TOTAL_MB} MB exceeds 5 MB budget!"
            exit 1
          else
            echo "✓ Bundle size is within budget."
          fi

  e2e:
    name: E2E Tests (Functional)
    runs-on: ubuntu-latest
    needs: [test, bundle-size]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run functional E2E tests
        run: npm run test:e2e:functional

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 30

  e2e-visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: [test, bundle-size]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run visual regression tests
        id: visual
        run: npm run test:e2e:visual
        continue-on-error: true

      - name: Upload visual diff artifacts
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            tests/e2e/__snapshots__/
          retention-days: 30

      - name: Comment on PR with visual regression results
        if: steps.visual.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Visual Regression Detected

            One or more screenshot baselines differ from the expected snapshots.

            **[View diff artifacts](${runUrl})** — download the \`visual-regression-diffs\` artifact to inspect the actual vs. expected screenshots.

            ### What to do
            - **If the visual change is intentional:** run the "Update Visual Snapshots" workflow from the Actions tab targeting this branch, or ask Claude Code to trigger it.
            - **If the visual change is unintentional:** investigate the code changes that affected rendering and fix the regression.

            *This check is non-blocking — it will not prevent merging.*`
            });
