name: Audit Fix

on:
  schedule:
    # Weekly, Monday 06:00 UTC — two hours ahead of the Security workflow's
    # scheduled audit, so a fix PR is already waiting if that gate would go red.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed for the fallback path below. When "Allow GitHub Actions to create and
  # approve pull requests" is disabled — which no workflow `permissions:` block
  # can override — pulls.create returns 403. Opening an issue is not restricted
  # that way and carries the same information. Harmless while the setting is on:
  # the fallback simply never runs.
  issues: write

# Never let two runs race to force-push the same branch.
concurrency:
  group: audit-fix
  cancel-in-progress: false

env:
  FIX_BRANCH: chore/npm-audit-fix

jobs:
  audit-fix:
    name: npm audit fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUDIT_FIX_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Snapshot lockfile before fixing
        run: cp package-lock.json "$RUNNER_TEMP/lock.before.json"

      - name: Run npm audit fix
        id: fix
        run: |
          # npm audit fix exits non-zero when vulnerabilities remain that it
          # cannot resolve within the existing semver ranges. That is not a
          # failure for this workflow — the lockfile diff below is what decides
          # whether there is anything to propose.
          #
          # --force is deliberately never used. It performs breaking major
          # version bumps, which is not something to open unattended.
          npm audit fix || true

          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes were needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise what changed
        if: steps.fix.outputs.changed == 'true'
        run: |
          node - "$RUNNER_TEMP/lock.before.json" package-lock.json > "$RUNNER_TEMP/versions.md" <<'NODE'
          const fs = require('fs');
          const [, , beforePath, afterPath] = process.argv;
          const pkgs = (p) => JSON.parse(fs.readFileSync(p, 'utf8')).packages ?? {};
          const before = pkgs(beforePath);
          const after = pkgs(afterPath);
          const rows = [];
          for (const key of new Set([...Object.keys(before), ...Object.keys(after)])) {
            const from = before[key]?.version;
            const to = after[key]?.version;
            if (from === to) continue;
            const name = key.replace(/^node_modules\//, '') || '(root)';
            rows.push(`| \`${name}\` | ${from ?? '—'} | ${to ?? '—'} |`);
          }
          rows.sort();
          console.log('| Package | From | To |');
          console.log('| --- | --- | --- |');
          console.log(rows.join('\n'));
          NODE
          cat "$RUNNER_TEMP/versions.md"

          # Whatever npm could not fix in range is reported in the PR body so a
          # reviewer knows a manual major bump is still outstanding.
          npm audit --audit-level=high > "$RUNNER_TEMP/audit.after.txt" 2>&1 || true
          cat "$RUNNER_TEMP/audit.after.txt"

      # The gates run here because a PR opened with the default GITHUB_TOKEN
      # does not trigger other workflows (GitHub blocks that to avoid recursive
      # runs). Without this, an unverified lockfile change could sit in a PR
      # showing no checks at all. E2E is skipped — too slow for this job, and it
      # cannot be affected by a lockfile-only patch bump.
      - name: Lint
        if: steps.fix.outputs.changed == 'true'
        run: npm run lint

      - name: Format check
        if: steps.fix.outputs.changed == 'true'
        run: npm run format:check

      - name: Type check
        if: steps.fix.outputs.changed == 'true'
        run: npx tsc --noEmit

      - name: Build
        if: steps.fix.outputs.changed == 'true'
        run: npm run build

      - name: Unit tests
        if: steps.fix.outputs.changed == 'true'
        run: npm test

      - name: Push fix branch
        if: steps.fix.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$FIX_BRANCH"
          git add package.json package-lock.json
          git commit \
            -m "fix: apply npm audit fix" \
            -m "Generated by the scheduled Audit Fix workflow. Changes sit within the existing semver ranges — npm audit fix was run without --force, so no major version bumps are included."

          # Force-push: this branch is a scratch branch owned by this workflow
          # and is recreated from main on every run.
          git push --force origin "$FIX_BRANCH"

      - name: Open or update pull request
        if: steps.fix.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.AUDIT_FIX_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const branch = process.env.FIX_BRANCH;
            const versions = fs.readFileSync(`${process.env.RUNNER_TEMP}/versions.md`, 'utf8').trim();
            const auditAfter = fs.readFileSync(`${process.env.RUNNER_TEMP}/audit.after.txt`, 'utf8').trim();
            const clean = auditAfter.includes('found 0 vulnerabilities');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## Summary',
              '',
              'Automated `npm audit fix` from the scheduled **Audit Fix** workflow.',
              'Run without `--force`, so every change sits inside the existing semver',
              'ranges — no major version bumps.',
              '',
              '### Packages changed',
              '',
              versions,
              '',
              '### Audit state after the fix',
              '',
              clean
                ? '`npm audit --audit-level=high` reports **0 vulnerabilities**.'
                : ['Vulnerabilities remain that `npm audit fix` could not resolve in range.',
                   'These need a manual major bump:',
                   '',
                   '```',
                   auditAfter,
                   '```'].join('\n'),
              '',
              '## Quality Gates Verified',
              '',
              'Run inside the workflow ([logs](' + runUrl + ')), because a PR opened with',
              'the default `GITHUB_TOKEN` does not trigger other workflows.',
              '',
              '- [x] Lint (`npm run lint`)',
              '- [x] Format (`npm run format:check`)',
              '- [x] Type check (`npx tsc --noEmit`)',
              '- [x] Build (`npm run build`)',
              '- [x] Unit tests (`npm test`)',
              '- [ ] E2E — not run here; a lockfile-only patch bump cannot affect it',
              '',
              '## Follow-up',
              '',
              '- The branch is regenerated from `main` on every run and force-updated in place,',
              '  so this is refreshed rather than duplicated.',
              '- Review the version table above before merging.',
            ].join('\n');

            const { owner, repo } = context.repo;

            // Labelling is best-effort. A missing label would otherwise fail the
            // whole step after the PR or issue has already been created.
            const label = async (number) => {
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: number, labels: ['dependencies'],
                });
              } catch (err) {
                core.warning(`Could not label #${number}: ${err.message}`);
              }
            };

            const { data: existingPrs } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });

            if (existingPrs.length > 0) {
              await github.rest.pulls.update({
                owner, repo, pull_number: existingPrs[0].number, body,
              });
              core.notice(`Updated existing PR #${existingPrs[0].number}`);
              return;
            }

            try {
              const { data: created } = await github.rest.pulls.create({
                owner, repo,
                title: 'fix: apply npm audit fix',
                head: branch,
                base: 'main',
                body,
              });
              await label(created.number);
              core.notice(`Opened PR #${created.number}`);
              return;
            } catch (err) {
              // Only this specific refusal is recoverable. "Allow GitHub Actions
              // to create and approve pull requests" is off, and a workflow
              // cannot grant itself that. Anything else — a bad base, a missing
              // branch, a transient 5xx — is a real failure and must stay loud.
              const blocked =
                err.status === 403 &&
                /not permitted to create or approve pull requests/i.test(err.message ?? '');
              if (!blocked) throw err;
              core.warning(
                'Actions is not permitted to create pull requests; opening an issue instead.',
              );
            }

            // Fallback. The branch is already pushed and verified, so the work is
            // not lost — a human just has to open the PR.
            const compareUrl =
              `${context.serverUrl}/${owner}/${repo}/compare/main...${branch}?expand=1`;
            const issueTitle = 'Automated npm audit fix is waiting for a pull request';
            const issueBody = [
              `**[→ Open the pull request](${compareUrl})**`,
              '',
              `The fix is committed and pushed to \`${branch}\`, and every quality gate`,
              'below passed against it. It could not be turned into a pull request',
              'automatically: this repository has **Settings → Actions → General →',
              'Workflow permissions → "Allow GitHub Actions to create and approve pull',
              'requests"** disabled, and a workflow cannot override that from its own',
              '`permissions:` block.',
              '',
              'Enabling that setting, or setting an `AUDIT_FIX_TOKEN` secret to a PAT,',
              'makes this issue stop appearing and the PR open on its own.',
              '',
              '---',
              '',
              body,
            ].join('\n');

            // Reuse one issue rather than filing a fresh one every week. Matched by
            // title; listForRepo also returns pull requests, so those are filtered.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existingIssue = openIssues.find(
              (i) => !i.pull_request && i.title === issueTitle,
            );

            let issueNumber;
            if (existingIssue) {
              await github.rest.issues.update({
                owner, repo, issue_number: existingIssue.number, body: issueBody,
              });
              issueNumber = existingIssue.number;
              core.notice(`Updated existing issue #${issueNumber}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner, repo, title: issueTitle, body: issueBody,
              });
              issueNumber = issue.number;
              await label(issueNumber);
              core.notice(`Opened issue #${issueNumber}`);
            }

            // Surface the fallback in the run summary, so the reason is visible
            // on the run itself rather than only in the step log.
            await core.summary
              .addHeading('Audit fix is waiting for a pull request', 3)
              .addRaw([
                `The fix is committed to \`${branch}\` and every quality gate passed`,
                `against it. Actions is not permitted to open the pull request, so it is`,
                `tracked on issue #${issueNumber}.`,
                '',
                `[→ Open the pull request](${compareUrl})`,
              ].join('\n'))
              .write();

            // Fail deliberately. The fix itself is fine — it is verified and
            // pushed — but it is parked where only a human can finish it, and a
            // green run is indistinguishable from "nothing needed doing". That
            // ambiguity is why three weeks of correct fallbacks went unnoticed.
            // A red run puts an X in the Actions list and triggers GitHub's
            // scheduled-workflow failure notification.
            //
            // This unwinds itself: once Actions is permitted to open pull
            // requests, pulls.create succeeds, the fallback never runs, and the
            // job goes green again. Revoking that permission later brings the
            // signal back automatically.
            core.setFailed(
              `Audit fix verified and pushed to ${branch}, but Actions cannot open ` +
              `the pull request. Tracked on issue #${issueNumber}. Open it from ` +
              `${compareUrl}, or enable Settings → Actions → General → Workflow ` +
              `permissions → "Allow GitHub Actions to create and approve pull requests".`,
            );

      - name: Report no-op
        if: steps.fix.outputs.changed == 'false'
        run: echo "::notice::npm audit fix made no changes — nothing to propose."
