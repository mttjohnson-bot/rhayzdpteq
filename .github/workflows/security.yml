name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    - cron: "0 8 * * 1" # weekly Monday 8am UTC

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only production dependencies (today just `three`) are bundled into the
      # site that browsers load, so an advisory there can reach players. High
      # and critical fail the check.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Everything else is build, test and lint tooling. It never reaches a
      # browser, and every advisory this job has failed on so far was one of
      # these (postcss, brace-expansion, nanoid, undici, minimatch): a weekly
      # red run with nothing for players at stake. The tooling does run in CI,
      # where some jobs hold write tokens, so a critical advisory still fails
      # the check. Anything below critical is written to the run summary and
      # is picked up by the next planned dependency refresh instead.
      - name: Audit build and test tooling
        if: ${{ !cancelled() }}
        run: |
          npm audit > "$RUNNER_TEMP/audit.txt" 2>&1 || true
          {
            echo '### Full dependency tree (fails on critical only)'
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=critical

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
