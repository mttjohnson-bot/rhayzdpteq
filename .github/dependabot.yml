version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # No `cooldown` is set here, but Dependabot still applies a 3-day minimum
    # release age by default (its logs show "Filtered out 1 versions due to
    # cooldown" and `npm install ... --min-release-age=3`). A release published
    # in the days before the weekly run is skipped and picked up the week
    # after: that is why three 0.186.1 and vite 8.3.1 were missing from the
    # 2026-09-24 run. This is intended supply-chain protection, not a fault.
    target-branch: main
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is blocked by typescript-eslint, which still declares
      # peerDependencies.typescript ">=4.8.4 <6.1.0" as of 8.70.1. Installing
      # TS 7 alongside it fails `npm ci` with ERESOLVE, so the update cannot
      # pass CI (see #192). Scoped to the 7.x line only — 6.x minor and patch
      # updates still come through, and TS 8 will be offered when it lands.
      # Remove this entry once typescript-eslint widens its peer range.
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      # three and @types/three must always move together — a version mismatch
      # between the library and its type definitions breaks the type check.
      # They live in different dependency types (three is the only production
      # dependency, @types/three is dev), so the dev/production groups below
      # also match them. Declaring this group first is NOT enough to keep the
      # pair together: see "How Dependabot picks a group" below.
      three:
        patterns:
          - "three"
          - "@types/three"

      # vitest and @vitest/coverage-v8 must always move together. The coverage
      # reporter declares an *exact* peer on the test runner
      # (peerDependencies.vitest "5.0.0", not a range), so a PR that bumps one
      # without the other cannot resolve and `npm ci` fails with ERESOLVE
      # before any check runs. That is what happened to #211 and #212: the
      # vitest 5 major arrived as two separate PRs, and neither could pass CI
      # on its own no matter how many times it was re-run.
      #
      # Unlike the dev-dependencies group below, this group deliberately sets
      # no `update-types` filter, so it claims majors too. The "majors stay
      # ungrouped" convention noted at the bottom of this file is what split
      # the pair in the first place; for an exact-peer pair the convention has
      # to yield, because an unmergeable PR cannot be reviewed on its own
      # merits anyway. Both packages are also excluded from `dev-dependencies`
      # below; without that exclusion this group only ever held `vitest`.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

      # Minor and patch bumps to the dev toolchain land as a single PR. Beyond
      # cutting PR churn, the grouped update regenerates a larger slice of the
      # lockfile at once, which pulls transitive packages forward more often —
      # transitives are where the recurring npm audit failures come from.
      #
      # How Dependabot picks a group: when a dependency matches more than one
      # group, it is NOT assigned to the first one declared. The updater runs
      # a "specificity" check and hands the dependency to whichever group it
      # ranks as more specific, and it ranked this dependency-type group above
      # the `@vitest/*` wildcard. The 2026-09-24 run logged:
      #
      #   Skipping @vitest/coverage-v8 for group 'vitest' - belongs to more
      #   specific group 'dev-dependencies'
      #
      # so the `vitest` group held only `vitest` itself, and the pair was split
      # again. For patches that means two PRs racing the same change; for the
      # next major, `vitest` would arrive grouped while `@vitest/coverage-v8`
      # (a major, so outside this group's update-types) arrived as its own
      # PR, and neither would install. That is #211/#212 exactly. #201 and
      # #207 double-claiming `@types/three` was most likely the same thing.
      #
      # So every package owned by a lockstep group above is excluded here by
      # name. With the exclusion in place the updater only checks the
      # intended group (the same log shows `@types/three` checked against
      # 'three' alone). Any new lockstep group needs a matching entry here.
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@types/three"
          - "vitest"
          - "@vitest/*"
        update-types:
          - minor
          - patch

      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

      # If Dependabot security updates are enabled for this repository (a
      # setting under Code security, not something dependabot.yml can turn on),
      # this collapses the resulting fixes into one PR instead of one per
      # advisory. Harmless while that setting is off.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        update-types:
          - minor
          - patch

# Major version bumps are deliberately left ungrouped in both ecosystems, so
# each one arrives as its own PR with its own CI run and can be reviewed and
# reverted on its own. The exception is a group above that sets no
# `update-types` filter (currently `three` and `vitest`): those packages are
# bound by exact or lockstep peer dependencies and cannot install apart, so
# their majors are grouped too. Splitting them does not produce two reviewable
# PRs, it produces two unmergeable ones.
