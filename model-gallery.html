<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Gallery — Rhayzd Pteq</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: monospace;
        color: #e0e0e0;
      }
      #header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 12px 20px;
        background: rgba(0, 0, 0, 0.6);
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      #header h1 {
        font-size: 18px;
        color: #ffd700;
      }
      #header a {
        color: #88aaff;
        text-decoration: none;
        font-size: 14px;
      }
      #header a:hover {
        text-decoration: underline;
      }
      #controls {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 12px 20px;
        background: rgba(0, 0, 0, 0.6);
        z-index: 10;
        text-align: center;
        font-size: 13px;
        color: #aaa;
      }
      .label {
        position: absolute;
        bottom: 60px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #444;
        border-radius: 4px;
        font-size: 14px;
        z-index: 10;
        text-align: center;
      }
      .label .name {
        color: #ffd700;
        font-size: 16px;
        font-weight: bold;
      }
      .label .status {
        margin-top: 4px;
        font-size: 12px;
      }
      .status.loaded {
        color: #4caf50;
      }
      .status.failed {
        color: #f44336;
      }
      #label-left {
        left: 25%;
        transform: translateX(-50%);
      }
      #label-right {
        left: 75%;
        transform: translateX(-50%);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <h1>Model Gallery</h1>
      <a href="./">← Back to Game</a>
    </div>
    <div id="label-left" class="label">
      <div class="name">Simple (Box)</div>
      <div id="status-simple" class="status">Loading...</div>
    </div>
    <div id="label-right" class="label">
      <div class="name">Owl (Voxel)</div>
      <div id="status-owl" class="status">Loading...</div>
    </div>
    <div id="controls">
      Drag to rotate · Scroll to zoom · Models auto-rotate
    </div>
    <script type="module" src="/src/model-gallery.ts"></script>
  </body>
</html>
